name: Build Notebook Scuola

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check
      NEXT_PUBLIC_SITE_URL: https://notebookscuola.it
      SUPABASE_SECRET_KEY: build-check-not-a-real-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Next.js application
        run: npm run build

  sql-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: postgres
          POSTGRES_DB: notebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notebook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare isolated Supabase Auth fixtures
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d notebook_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN CREATE ROLE supabase_auth_admin NOLOGIN; END IF;
          END;
          $$;

          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );

          CREATE TABLE public.parental_consent_requests (
            id uuid PRIMARY KEY,
            child_email text NOT NULL,
            status text NOT NULL,
            guardian_declaration_accepted boolean NOT NULL DEFAULT false,
            approved_at timestamptz,
            expires_at timestamptz NOT NULL,
            auth_user_id uuid REFERENCES auth.users(id) ON DELETE SET NULL
          );
          SQL

      - name: Apply registration authorization SQL
        env:
          PGPASSWORD: test-only-password
        run: psql -h localhost -U postgres -d notebook_test -v ON_ERROR_STOP=1 -f supabase/registration-authorization-hook.sql

      - name: Test one-time tickets and parental consent checks
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d notebook_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.parental_consent_requests
            (id, child_email, status, guardian_declaration_accepted, approved_at, expires_at)
          VALUES
            ('11111111-1111-4111-8111-111111111111', 'studente@example.test', 'approved', true, now(), now() + interval '2 days'),
            ('44444444-4444-4444-8444-444444444444', 'in-attesa@example.test', 'pending', false, null, now() + interval '2 days');

          INSERT INTO public.registration_authorizations
            (id, student_email, authorization_type, parental_consent_request_id, expires_at)
          VALUES
            ('22222222-2222-4222-8222-222222222222', 'studente@example.test', 'parental_consent', '11111111-1111-4111-8111-111111111111', now() + interval '1 day'),
            ('55555555-5555-4555-8555-555555555555', 'in-attesa@example.test', 'age_14_plus', null, now() + interval '1 day');

          SET ROLE supabase_auth_admin;
          SELECT public.hook_validate_registration_authorization(
            jsonb_build_object(
              'user', jsonb_build_object(
                'email', 'studente@example.test',
                'app_metadata', jsonb_build_object('provider', 'email'),
                'user_metadata', jsonb_build_object('registration_ticket', '22222222-2222-4222-8222-222222222222')
              )
            )
          );
          RESET ROLE;

          INSERT INTO auth.users (id, email, raw_user_meta_data)
          VALUES (
            '33333333-3333-4333-8333-333333333333',
            'studente@example.test',
            jsonb_build_object('display_name', 'Studente', 'registration_ticket', '22222222-2222-4222-8222-222222222222')
          );

          DO $ticket_test$
          DECLARE
            v_result jsonb;
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.registration_authorizations
              WHERE id = '22222222-2222-4222-8222-222222222222'
                AND consumed_at IS NOT NULL
                AND consumed_by_auth_user_id = '33333333-3333-4333-8333-333333333333'
            ) THEN
              RAISE EXCEPTION 'Ticket genitore non consumato o non collegato all''utente creato';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM public.parental_consent_requests
              WHERE id = '11111111-1111-4111-8111-111111111111'
                AND auth_user_id = '33333333-3333-4333-8333-333333333333'
            ) THEN
              RAISE EXCEPTION 'La richiesta genitoriale non è stata collegata all''account';
            END IF;

            IF EXISTS (
              SELECT 1 FROM auth.users
              WHERE id = '33333333-3333-4333-8333-333333333333'
                AND raw_user_meta_data ? 'registration_ticket'
            ) THEN
              RAISE EXCEPTION 'Il ticket è rimasto nei metadati Auth dell''utente';
            END IF;

            v_result := public.hook_validate_registration_authorization(
              jsonb_build_object(
                'user', jsonb_build_object(
                  'email', 'studente@example.test',
                  'app_metadata', jsonb_build_object('provider', 'email'),
                  'user_metadata', jsonb_build_object('registration_ticket', '22222222-2222-4222-8222-222222222222')
                )
              )
            );
            IF NOT (v_result ? 'error') THEN
              RAISE EXCEPTION 'Il riutilizzo di un ticket già consumato non è stato bloccato';
            END IF;

            v_result := public.hook_validate_registration_authorization(
              jsonb_build_object(
                'user', jsonb_build_object(
                  'email', 'senza-ticket@example.test',
                  'app_metadata', jsonb_build_object('provider', 'email'),
                  'user_metadata', '{}'::jsonb
                )
              )
            );
            IF NOT (v_result ? 'error') THEN
              RAISE EXCEPTION 'Una registrazione senza ticket non è stata bloccata';
            END IF;

            v_result := public.hook_validate_registration_authorization(
              jsonb_build_object(
                'user', jsonb_build_object(
                  'email', 'in-attesa@example.test',
                  'app_metadata', jsonb_build_object('provider', 'email'),
                  'user_metadata', jsonb_build_object('registration_ticket', '55555555-5555-4555-8555-555555555555')
                )
              )
            );
            IF NOT (v_result ? 'error') THEN
              RAISE EXCEPTION 'Un ticket 14+ ha superato una richiesta genitoriale pendente';
            END IF;
          END;
          $ticket_test$;

          SET ROLE service_role;
          SELECT public.take_registration_rate_limit(
            ARRAY['aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'],
            2,
            3600
          );
          RESET ROLE;

          DO $limit_test$
          BEGIN
            IF NOT public.take_registration_rate_limit(
              ARRAY['aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'],
              2,
              3600
            ) THEN
              RAISE EXCEPTION 'La seconda richiesta entro soglia è stata bloccata';
            END IF;

            IF public.take_registration_rate_limit(
              ARRAY['aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'],
              2,
              3600
            ) THEN
              RAISE EXCEPTION 'La richiesta oltre soglia non è stata bloccata';
            END IF;
          END;
          $limit_test$;
          SQL
